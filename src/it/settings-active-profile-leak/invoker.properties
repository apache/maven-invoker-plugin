# MINVOKER-293: activate a profile on the (outer) command line invoking this IT project, exactly
# like a real user running "mvn -Pleak-check ...". This profile must never leak into the
# settings.xml written for the nested IT project run by this project's own invoker:run execution.
invoker.profiles = leak-check
